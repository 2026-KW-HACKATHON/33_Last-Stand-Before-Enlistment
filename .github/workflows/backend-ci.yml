name: Backend CI

on:
  pull_request:
    branches: [back/develop, main]
  push:
    branches: [back/develop, 'back/feature/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Backend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DISCUSHION_TEST_JDBC_URL: jdbc:postgresql://127.0.0.1:55432/discushion_migration_test
      DISCUSHION_TEST_DB_PASSWORD: synthetic-ci-only-password
      DISCUSHION_VERIFY_SUPABASE: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare isolated PostgreSQL and verify migrations
        run: bash scripts/ci/backend-db-tests.sh
      - name: Test and build
        working-directory: backend
        run: sh ./gradlew --no-daemon test build --rerun-tasks --console=plain
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-results
          path: |
            backend/build/reports/tests/
            backend/build/test-results/
          if-no-files-found: warn
      - name: Upload verified application
        uses: actions/upload-artifact@v7
        with:
          name: backend-jar
          path: backend/build/libs/discushion.jar
      - name: Remove isolated test container
        if: always()
        run: docker rm -f discushion-ci-postgres || true
