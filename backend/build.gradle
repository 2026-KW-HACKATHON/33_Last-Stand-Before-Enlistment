plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.8'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.discushion'
version = '0.0.1-SNAPSHOT'
description = 'Discushion backend'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.security:spring-security-oauth2-jose'
	runtimeOnly 'org.postgresql:postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.named('bootJar') {
	archiveFileName = 'discushion.jar'
}

tasks.named('jar') {
	enabled = false
}

// #75 admin-only tooling is compiled separately and excluded from the production JAR.
sourceSets {
    demo {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    demoImplementation.extendsFrom implementation
    demoRuntimeOnly.extendsFrom runtimeOnly
}
sourceSets.test.compileClasspath += sourceSets.demo.output
sourceSets.test.runtimeClasspath += sourceSets.demo.output
tasks.named('compileTestJava') { dependsOn tasks.named('demoClasses') }
tasks.register('demoProvision', JavaExec) {
    dependsOn tasks.named('demoClasses')
    classpath = sourceSets.demo.runtimeClasspath
    mainClass = 'com.discushion.demo.DemoProvisionMain'
    doFirst {
        if (!project.hasProperty('demoPlan')) throw new GradleException('Supply -PdemoPlan=/absolute/external/plan.json; credentials via DEMO_DB_* environment only')
        args = [project.findProperty('demoApply') == 'true' ? '--apply' : '--check', project.property('demoPlan')]
    }
}
